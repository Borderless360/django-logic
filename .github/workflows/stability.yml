name: Stability Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  stability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: django_logic_test
          POSTGRES_USER: django_logic
          POSTGRES_PASSWORD: django_logic
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U django_logic -d django_logic_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install psycopg2-binary

      # tests/background needs real PostgreSQL in places, and this job is the
      # only one that gives it. The tests pin the row lock the worker takes to
      # execute a row (select_for_update(nowait) makes a second worker skip a
      # locked row) and the LISTEN/NOTIFY wake-up. A past release broke the
      # lock rule, and a later one shipped a wake-up that never ran, while the
      # SQLite suite and the stability suite both stayed green. This job
      # installs psycopg2, so it also covers the driver the SQLite suite and
      # the dev extra do not.
      - name: Run PostgreSQL background tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_stability
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_DB: django_logic_test
          POSTGRES_USER: django_logic
          POSTGRES_PASSWORD: django_logic
          REDIS_URL: redis://localhost:6380/0
        run: |
          python tests/manage.py test tests.background --verbosity=2

      - name: Run stability tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_stability
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_DB: django_logic_test
          POSTGRES_USER: django_logic
          POSTGRES_PASSWORD: django_logic
          REDIS_URL: redis://localhost:6380/0
        run: |
          python tests/manage.py test tests.stability --verbosity=2 --tag=stability
