name: Stability Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:

jobs:
  stability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        driver: [psycopg, psycopg2]
        django: ["5.2", "6.0", "6.1"]

    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django }} / ${{ matrix.driver }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: django_logic_test
          POSTGRES_USER: django_logic
          POSTGRES_PASSWORD: django_logic
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U django_logic -d django_logic_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          POSTGRES_DRIVER: ${{ matrix.driver }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . "Django~=${{ matrix.django }}.0" "redis>=4.2"
          if [ "$POSTGRES_DRIVER" = "psycopg" ]; then
            pip install "psycopg[binary]>=3.2"
          else
            pip install psycopg2-binary
          fi

      - name: Verify PostgreSQL driver
        env:
          POSTGRES_DRIVER: ${{ matrix.driver }}
        run: |
          python - <<'PY'
          import importlib.util
          import os

          from django.db.backends.postgresql.base import Database

          expected = os.environ['POSTGRES_DRIVER']
          other = 'psycopg2' if expected == 'psycopg' else 'psycopg'
          print(f'Django selected {Database.__name__} {Database.__version__}')
          assert Database.__name__ == expected, (Database.__name__, expected)
          assert importlib.util.find_spec(other) is None, f'{other} must not be installed'
          PY

      - name: Run PostgreSQL and Redis tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_stability
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_DB: django_logic_test
          POSTGRES_USER: django_logic
          POSTGRES_PASSWORD: django_logic
          REDIS_URL: redis://localhost:6380/0
        run: python tests/manage.py test --verbosity=2
