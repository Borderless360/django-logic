name: Stability Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  stability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        driver: [psycopg, psycopg2]

    name: Python ${{ matrix.python-version }} / ${{ matrix.driver }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: django_logic_test
          POSTGRES_USER: django_logic
          POSTGRES_PASSWORD: django_logic
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U django_logic -d django_logic_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          POSTGRES_DRIVER: ${{ matrix.driver }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . "coverage>=7.0" "redis>=4.2"
          if [ "$POSTGRES_DRIVER" = "psycopg" ]; then
            pip install "psycopg[binary]>=3.2"
          else
            pip install psycopg2-binary
          fi

      - name: Verify PostgreSQL driver
        env:
          POSTGRES_DRIVER: ${{ matrix.driver }}
        run: |
          python - <<'PY'
          import importlib.util
          import os

          from django.db.backends.postgresql.base import Database

          expected = os.environ['POSTGRES_DRIVER']
          other = 'psycopg2' if expected == 'psycopg' else 'psycopg'
          print(f'Django selected {Database.__name__} {Database.__version__}')
          assert Database.__name__ == expected, (Database.__name__, expected)
          assert importlib.util.find_spec(other) is None, f'{other} must not be installed'
          PY

      # tests/background needs real PostgreSQL in places, and this job is the
      # only one that gives it. The tests pin the row lock the worker takes to
      # execute a row (select_for_update(nowait) makes a second worker skip a
      # locked row) and the LISTEN/NOTIFY wake-up. A past release broke the
      # lock rule, and a later one shipped a wake-up that never ran, while the
      # SQLite suite and the stability suite both stayed green. This job
      # tests each PostgreSQL driver in a separate environment.
      - name: Run PostgreSQL background tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_stability
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_DB: django_logic_test
          POSTGRES_USER: django_logic
          POSTGRES_PASSWORD: django_logic
          REDIS_URL: redis://localhost:6380/0
        run: |
          python tests/manage.py test tests.background --verbosity=2

      - name: Run stability tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_stability
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5433"
          POSTGRES_DB: django_logic_test
          POSTGRES_USER: django_logic
          POSTGRES_PASSWORD: django_logic
          REDIS_URL: redis://localhost:6380/0
        run: |
          python tests/manage.py test tests.stability --verbosity=2 --tag=stability
