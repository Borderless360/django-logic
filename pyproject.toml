[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-logic"
version = "5.2.1"
description = "Declarative business logic & state machines for Django — sync and durable background transitions"
readme = "README.md"
license = { text = "MIT License" }
authors = [
    { name = "Emil Balashov", email = "emil@borderless360.com" },
    { name = "Andrey Omelyanuk", email = "omelyanukandrey@gmail.com" }
]
keywords = ["django", "fsm", "state-machine", "workflow", "background", "business-logic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
    "django-model-utils>=4.5.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "coverage>=7.0",
    # Driver for the PostgreSQL stability suite and the
    # PostgreSQL concurrency tests. Without it, `uv sync --extra dev` runs the
    # SQLite suite but not tests.stability.
    "psycopg[binary]>=3.2",
    # Client for Django's built-in Redis cache backend. The real-Redis and
    # stability test settings use that backend for worker-presence observations.
    "redis>=4.2",
]

[project.urls]
Documentation = "https://github.com/Borderless360/django-logic/blob/master/README.md"
Repository = "https://github.com/Borderless360/django-logic"

[tool.setuptools.packages.find]
include = ["django_logic*"]

[tool.coverage.run]
source = ["django_logic"]

[tool.coverage.report]
show_missing = true
skip_empty = true
