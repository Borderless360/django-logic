[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-logic"
version = "0.14.1"
description = "Declarative business logic & state machines for Django — sync and durable background transitions"
readme = "README.md"
license = { text = "MIT License" }
authors = [
    { name = "Emil Balashov", email = "emil@borderless360.com" },
    { name = "Andrey Omelyanuk", email = "omelyanukandrey@gmail.com" }
]
keywords = ["django", "fsm", "state-machine", "workflow", "celery", "background", "business-logic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    # The floor matches the tested matrix in the classifiers and CI. Version
    # 0.5.0 dropped 4.0, 4.1 and 5.0, so this excludes 5.0. There is no upper
    # bound: the django-main CI job warns about an unreleased Django instead.
    "django>=4.2,!=5.0.*",
    "django-model-utils>=4.5.1",
    # Celery is a core dependency, not an extra. In production every
    # background transition executes through Celery, and background/tasks.py
    # imports shared_task at module level. 'sync' execution exists only for
    # tests and CI.
    "celery>=5.0",
]

[project.optional-dependencies]
# Celery is a core dependency, so [celery] is an empty alias. It stays here so
# an existing `pip install django-logic[celery,redis]` pin still resolves.
celery = []
# The engine never imports django_redis: the state lock goes through Django's
# cache API (`State.lock` calls `cache.add`), so any cross-process backend
# works, including the RedisCache that Django itself ships. This extra
# installs the third-party backend for settings that name
# `django_redis.cache.RedisCache`.
redis = ["django-redis>=5.0.0"]
dev = [
    "coverage>=7.0",
    # Driver for the PostgreSQL stability suite (make stability-*) and the
    # PostgreSQL concurrency tests. Without it, `uv sync --extra dev` runs the
    # SQLite suite but not tests.stability.
    "psycopg[binary]>=3.1",
    # Client for Django's built-in Redis cache backend. The real-Redis and
    # stability test settings use that backend for the state lock.
    "redis>=4.2",
]

[project.urls]
Homepage = "https://github.com/Borderless360/django-logic"
Repository = "https://github.com/Borderless360/django-logic"

[tool.setuptools.packages.find]
exclude = ["tests*", "demo*"]

[tool.setuptools]
zip-safe = false

[tool.coverage.run]
source = ["django_logic"]

[tool.coverage.report]
show_missing = true
skip_empty = true
